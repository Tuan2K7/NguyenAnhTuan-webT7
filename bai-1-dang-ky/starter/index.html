<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài 1 - Đăng ký thành viên CLB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Đăng ký thành viên CLB</h1>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="fullname">Họ tên</label>
        <input type="text" id="fullname" placeholder="Nguyễn Văn A" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="abc@gmail.com" />
      </div>

      <!-- TODO 1: Thêm nhóm ô nhập "Số điện thoại" (id="phone") -->
      <div class="form-group">
        <label for="phone">Số điện thoại</label>
        <input type="text" id="phone" placeholder="abc@gmail.com" />
      </div>
      <!-- TODO 2: Thêm nhóm ô nhập "Mật khẩu" (id="password", type="password") -->
      <div class="form-group">
        <label for="Mật khẩu">Mật khẩu</label>
        <input type="password" id="password" placeholder="abc@gmail.com" />
      </div>

      <button type="submit">Đăng ký</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
